# Strict-but-pragmatic ruleset based on very_good_analysis.
#
# We disable a handful of library-style rules that don't carry their
# weight in an application codebase (mandatory dartdoc on every member,
# constructor ordering, mandatory `package:` imports for relative paths
# we already use consistently, etc.). What's left flags real bug-prone
# patterns: discarded futures, unconstrained catches, generic-inference
# failures, redundant defaults, and so on.

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Library-grade ergonomics — overkill for an app codebase.
    public_member_api_docs: false
    sort_constructors_first: false
    sort_pub_dependencies: false

    # Stylistic preferences we don't want to enforce.
    lines_longer_than_80_chars: false
    always_use_package_imports: false
    prefer_int_literals: false
    omit_local_variable_types: false
    always_put_required_named_parameters_first: false
    directives_ordering: false
    cascade_invocations: false
    unnecessary_breaks: false
    unnecessary_underscores: false
    require_trailing_commas: false
    avoid_redundant_argument_values: false

    # Fire-and-forget animation controllers, navigator pushes, audio plays
    # are everywhere in Flutter and almost never need awaiting. Turning the
    # rule off project-wide is the common practice; `unawaited_futures`
    # (kept on) still catches the real footgun: forgotten await INSIDE an
    # async function that should have been chained.
    discarded_futures: false

    # Kept ON (already on by default in very_good_analysis):
    #   avoid_catches_without_on_clauses — narrow exception types
    #   inference_failure_on_instance_creation
    #   inference_failure_on_function_return_type
    #   prefer_const_constructors / prefer_const_literals_to_create_immutables
    #   unawaited_futures
    #   avoid_dynamic_calls
    #   close_sinks
